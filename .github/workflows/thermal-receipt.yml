name: Cashier interface checks
on:
  push:
    branches: [development/scanner-local-reliability]
    paths: ['index.html', 'tests/thermal-receipt*', 'tests/customer-selection*', 'stock-ui.js', 'tests/stock-balances*', '.github/workflows/thermal-receipt.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  receipt:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test tests/thermal-receipt.test.mjs tests/customer-selection.test.mjs tests/stock-balances-table.test.mjs
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install --with-deps chromium
      - run: node tests/thermal-receipt.smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: Thermal-receipt-58mm-80mm
          path: artifacts/thermal-receipts/
          if-no-files-found: error

name: Desktop Offline checks
on:
  push:
    branches: [main, development/functional-desktop, development/production-readiness]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build:
        description: 'Build Windows installer after all checks pass'
        type: boolean
        default: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ALMAHASIB_LICENSE_PUBLIC_KEY: ${{ vars.ALMAHASIB_LICENSE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Prepare developer public verification key
        if: env.ALMAHASIB_LICENSE_PUBLIC_KEY != ''
        shell: pwsh
        run: '[IO.File]::WriteAllText((Join-Path $PWD license-public.pem), $env:ALMAHASIB_LICENSE_PUBLIC_KEY)'
      - run: npm test
      - run: node tests/electron.smoke.cjs
      - run: npx electron tests/electron-report.smoke.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install chromium
      - run: node tests/ui.smoke.mjs
      - run: node tests/stock-ui.smoke.mjs
      - run: npm run test:scanner
      - run: npm run demo:create
      - run: npm run test:demo
      - run: npm run test:pos-layout
      - name: Build Windows installer after all checks
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Install, launch and upgrade the built Windows package
        run: node tests/windows-installer.smoke.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: AlMahasibPro-Offline-Windows
          path: dist/*.exe

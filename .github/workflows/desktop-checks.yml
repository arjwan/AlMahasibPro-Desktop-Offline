name: Desktop Offline checks
on:
  push:
    branches: [main, development/functional-desktop, development/production-readiness]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build:
        description: 'Build Windows installer after all checks pass'
        type: boolean
        default: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: node tests/electron.smoke.cjs
      - run: npx electron tests/electron-report.smoke.cjs
      - run: npm install --no-save --package-lock=false playwright@1.56.0
      - run: npx playwright install chromium
      - run: node tests/ui.smoke.mjs
      - run: node tests/stock-ui.smoke.mjs
      - if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.build == true)
        run: npm run build:win
      - if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.build == true)
        uses: actions/upload-artifact@v4
        with:
          name: AlMahasibPro-Offline-Windows
          path: dist/*.exe

name: Windows installer - demo candidate
on:
  workflow_dispatch:
  push:
    branches:
      - feature/external-device-readiness
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify source and smoke tests
        run: |
          node --check electron-main.cjs
          node --check desktop-preload.cjs
          node --check erp-ui.js
          npm test
      - name: Package Windows NSIS installer
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Upload installer and build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AlMahasibPro-Windows-demo-candidate
          path: |
            dist/*.exe
            dist/*.yml
          if-no-files-found: warn
          retention-days: 7

<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>قارئ باركود AlMahasibPro</title><style>*{box-sizing:border-box}body{margin:0;background:#071426;color:#fff;font-family:Arial;text-align:center}.wrap{max-width:600px;margin:auto;padding:20px}video{width:100%;border-radius:20px;background:#000;max-height:58vh}.card{background:#10213a;border:1px solid #29415f;border-radius:18px;padding:16px;margin:14px 0}input,button{width:100%;padding:14px;margin:6px 0;border-radius:12px;border:1px solid #405a7c;background:#0b1a2e;color:#fff;font-size:18px}button{background:#6d45ff;font-weight:bold}.ok{color:#53e39a}.bad{color:#ff7189}</style></head><body><div class="wrap"><h2>قارئ باركود AlMahasibPro</h2><div class="card"><input id="token" placeholder="رمز الربط من شاشة الكاشير"><button id="startcamera" onclick="start()">تشغيل الكاميرا</button><button id="stopcamera" onclick="stopCamera()">إيقاف الكاميرا</button><div id="status" role="status">أدخل رمز الربط</div></div><video id="v" playsinline></video><div class="card"><input id="manual" inputmode="numeric" placeholder="إدخال باركود يدوي"><button id="sendmanual" onclick="send(manual.value)">إرسال</button><button id="retryscan" hidden onclick="send(pendingScan?.barcode)">إعادة إرسال المسح</button></div></div><script>
const token=document.getElementById('token'),status=document.getElementById('status'),manual=document.getElementById('manual'),v=document.getElementById('v');
try{token.value=decodeURIComponent(location.hash.slice(1))||localStorage.getItem('alma-phone-token')||'';}catch{};
let detector,last='',lastAt=0,running=false,sending=false,pendingScan=null;
const retry=document.getElementById('retryscan');
const requestId=()=>typeof crypto.randomUUID==='function'?crypto.randomUUID():Array.from(crypto.getRandomValues(new Uint8Array(24)),x=>x.toString(16).padStart(2,'0')).join('');
async function connection(){const t=token.value.trim();if(!/^[a-f0-9]{32}$/.test(t))throw Error('رمز الربط غير صحيح');const r=await fetch('/api/v1/market/scanner/'+t+'/status');const b=await r.json();if(!r.ok){if(r.status===410)stopCamera();throw Error(typeof b.error==='string'?b.error:b.error?.message||'تعذر الاتصال بالكاشير')}try{localStorage.setItem('alma-phone-token',t)}catch{}return true}
function stopCamera(){running=false;if(v.srcObject){v.srcObject.getTracks().forEach(t=>t.stop());v.srcObject=null}}
async function start(){try{await connection();if(!('BarcodeDetector' in window))throw Error('استخدم تطبيق الماسح السابق أو الإدخال اليدوي؛ هذا المتصفح لا يدعم مسح الكاميرا');if(!navigator.mediaDevices?.getUserMedia)throw Error('افتح رابط HTTPS الموثوق للسماح بالكاميرا');stopCamera();detector=new BarcodeDetector({formats:['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code']});const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}}});v.srcObject=stream;await v.play();running=true;status.className='ok';status.textContent='متصل بالكاشير — جاهز للمسح';scan()}catch(e){stopCamera();status.className='bad';status.textContent=e.message}}
async function scan(){if(!running)return;try{const a=await detector.detect(v);if(a[0]){const code=a[0].rawValue,now=Date.now();if(code!==last||now-lastAt>1800){last=code;lastAt=now;await send(code)}}}catch{}if(running)requestAnimationFrame(scan)}
async function send(code){code=String(code||'').trim();const t=token.value.trim();if(!code||!t||sending)return false;sending=true;try{if(!pendingScan||pendingScan.barcode!==code)pendingScan={barcode:code,request_id:requestId()};const r=await fetch('/api/v1/market/scanner/'+encodeURIComponent(t)+'/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(pendingScan)});const b=await r.json().catch(()=>({}));if(!r.ok){if(r.status===410)stopCamera();throw Error(typeof b.error==='string'?b.error:b.error?.message||'فشل الإرسال')}pendingScan=null;retry.hidden=true;status.className='ok';status.textContent='تم إرسال: '+code;manual.value='';navigator.vibrate?.(80);return true}catch(e){retry.hidden=!pendingScan;status.className='bad';status.textContent=e.message;return false}finally{sending=false}}
async function heartbeat(){if(!token.value.trim())return;try{await connection();if(!running&&!pendingScan){status.className='ok';status.textContent='متصل بالكاشير — شغّل الكاميرا أو أدخل الباركود'}}catch(e){status.className='bad';status.textContent=e.message}}
const heartbeatTimer=setInterval(heartbeat,5000);heartbeat();window.addEventListener('pagehide',()=>{stopCamera();clearInterval(heartbeatTimer)});
</script></body></html>
